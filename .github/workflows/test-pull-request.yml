name: Test Pull Request

on:
  pull_request:

jobs:
  unittests:
    name: Unittests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.1
      - name: Run tests
        run: make test
  probe-build:
    name: Test build would pass on creation of new release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.1
      - name: Run build
        run: make build
      - name: Confirm executable build
        run: stat ./uwsgi_exporter
